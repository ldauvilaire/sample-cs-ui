name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: All (lint + build + test + package)
        run: npm run all

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-cs-ui
          path: sample-cs-ui.tar.gz
          retention-days: 7
